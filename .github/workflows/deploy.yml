name: Deploy Flutter Web
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # L'organizzazione concede ai workflow la sola lettura, quindi il permesso
    # di scrivere il ramo gh-pages va chiesto qui, limitato a questo lavoro.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Crea file .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Installa dipendenze
        run: flutter pub get

      # L'app dello staff vive sotto /gestione/: la radice del sito e' del
      # modulo clienti, perche' e' quello l'indirizzo che diamo ai clienti.
      - name: Build Web
        run: flutter build web --release --base-href "/gestione/"

      - name: Componi il sito
        run: |
          mkdir -p site/gestione
          cp -r build/web/. site/gestione/
          cp web/booking.html site/index.html
          cp web/booking.html site/booking.html
          cp web/booking-status.html site/booking-status.html
          cp web/logo.png site/logo.png
          cp web/favicon.png site/favicon.png

      - name: Deploy su GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Scritto qui e non solo nelle impostazioni: ogni pubblicazione
          # riscrive il ramo gh-pages e cancellerebbe il dominio impostato
          # a mano, lasciando il sito irraggiungibile senza motivo apparente.
          cname: prenota.hiooriental.com
